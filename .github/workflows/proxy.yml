name: GitHub Action Proxy

on:
  workflow_dispatch:

permissions: write-all

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests "httpx[http2]"

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Start Proxy Runner & Cloudflare Tunnel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 github_proxy_runner.py &
          sleep 2

          ./cloudflared tunnel --url http://127.0.0.1:8080 > cloudflared.log 2>&1 &
          echo "Waiting for Cloudflare Tunnel URL..."
          
          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "::error::Failed to obtain Cloudflare Tunnel URL!"
            cat cloudflared.log
            exit 1
          fi

          echo "=========================================="
          echo "Cloudflare Tunnel URL: $TUNNEL_URL"
          echo "=========================================="

          if ! gh issue view 1 >/dev/null 2>&1; then
            gh issue create --title "STOPPED" --body "GitHub Proxy Tunnel Status" || true
          fi

          for attempt in {1..5}; do
            if gh issue edit 1 --title "$TUNNEL_URL" --body "Active Cloudflare Tunnel URL for GitHub Proxy"; then
              break
            fi
            sleep 3
          done || true

      - name: Keep Runner Active
        run: |
          echo "Proxy server is active and listening for incoming requests..."
          for i in $(seq 1 2080); do
            sleep 10
          done

      - name: Cleanup Status on Exit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit 1 --title "STOPPED" --body "Proxy runner stopped" || true

name: GitHub Action Proxy

on:
  workflow_dispatch:

permissions:
  contents: read
  variables: write

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Start Proxy Runner & Cloudflare Tunnel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 github_proxy_runner.py &
          sleep 2

          ./cloudflared tunnel --url http://127.0.0.1:8080 > cloudflared.log 2>&1 &
          echo "Waiting for Cloudflare Tunnel URL..."
          
          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "::error::Failed to obtain Cloudflare Tunnel URL!"
            cat cloudflared.log
            exit 1
          fi

          echo "=========================================="
          echo "Cloudflare Tunnel URL: $TUNNEL_URL"
          echo "=========================================="

          gh variable set GH_PROXY_URL --body "$TUNNEL_URL" || echo "Failed to set GH_PROXY_URL"
          gh variable set GH_PROXY_STATUS --body "running" || echo "Failed to set GH_PROXY_STATUS"

      - name: Keep Runner Active
        run: |
          echo "Proxy server is active and listening for incoming requests..."
          # Loop for ~5.8 hours (20800 seconds)
          for i in $(seq 1 2080); do
            sleep 10
          done

      - name: Cleanup Status on Exit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set GH_PROXY_STATUS --body "stopped" || true
